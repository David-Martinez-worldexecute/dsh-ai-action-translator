<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AI action translator">
  <defs>
    <linearGradient id="aat-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- 外框：一块「正在被解释的屏幕」 -->
  <rect x="5" y="11" width="54" height="42" rx="9" fill="none" stroke="url(#aat-g)" stroke-width="3.2"/>

  <!-- 左：原始动作（齿轮/命令的形状，用两条斜线表示） -->
  <path d="M16 26 L23 32 L16 38" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 38 H33" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- 右：翻译后的人话（一条对话气泡） -->
  <path d="M37 25 h16 a4 4 0 0 1 4 4 v7 a4 4 0 0 1 -4 4 h-9 l-5 4 v-4 h-2 a4 4 0 0 1 -4 -4 v-7 a4 4 0 0 1 4 -4 z"
        fill="url(#aat-g)" opacity="0.92"/>

  <!-- 中间：解释发生的位置（一个亮点） -->
  <circle cx="33" cy="32" r="2.6" fill="#38bdf8"/>
</svg>
