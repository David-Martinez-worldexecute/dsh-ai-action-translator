name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 与 package.json 的 engines.node (>=20) 对齐：20 是最低支持线，
        # 22 与 24 是当前 LTS 线。更高版本按 engines 视为受支持但未逐一测过。
        node: ['20', '22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 本插件零运行时依赖；这一步只为拿到开发依赖 @deepseek-ai/schemastery。
      # 用 npm ci 而不是 npm install：它严格按 package-lock.json 装，
      # 装出来的依赖树与维护者本机一致，也让缓存失效可预测。
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Privacy check
        run: npm run check:privacy

      # 真实装载冒烟：用假宿主把 apply() 完整跑一遍，证明
      # 「注册提示词段 / 订阅工具事件 / 面板应答 / 卸载清理」这条链路没断。
      # 它不替代真装进 DSH（那需要桌面版重启），但能挡住「代码层面装不起来」。
      - name: Load smoke
        run: node scripts/load-smoke.mjs

  package:
    name: Package sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      # 确认发布包里没有 node_modules、没有多余文件。
      - name: npm pack dry run
        run: npm pack --dry-run
